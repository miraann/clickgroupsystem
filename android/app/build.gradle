apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────────
// Passwords + keystore path live in android/keystore.properties, which is
// git-ignored. When that file is absent (fresh clone, CI without secrets) the
// release build silently falls back to the debug keystore so `assembleRelease`
// still produces an installable — but NOT publishable — APK.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def hasReleaseKeystore = keystorePropsFile.exists()

android {
    namespace = "com.clickgroup.pos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clickgroup.pos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             //
             // `apps` excludes assets/public/apps — the self-hosted APK downloads
             // (public/apps/*.apk) that Next.js serves to browsers. This shell never
             // loads its own bundled assets/public at runtime (capacitor.config.ts sets
             // server.url, so the WebView navigates straight to the live Vercel URL) —
             // so packaging that folder just embeds every previously-built APK inside
             // each new one, compounding in size release after release.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:apps'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // capacitor-android's own consumerProguardFiles (node_modules/@capacitor/android/
            // capacitor/proguard-rules.pro) already keeps every class extending
            // com.getcapacitor.Plugin in full, so our custom TcpPlugin/UpdaterPlugin
            // (reflectively invoked by the JS bridge) survive R8 untouched.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ── Product flavors: four separately installable APKs from one project ──
    // Every flavor is the same Capacitor WebView shell; they differ only by
    // applicationId, launcher name/icon, and the server.url in their
    // src/<flavor>/assets/capacitor.config.json (which overrides the generated
    // src/main/assets/capacitor.config.json).
    //
    //   cashier  → com.clickgroup.pos          → /dashboard        (original app,
    //              no suffix — existing installs / Firebase config untouched)
    //   driver   → com.clickgroup.pos.driver   → /dashboard/driver
    //   seller   → com.clickgroup.pos.seller   → /seller-login   (Admin Seller Panel)
    //   cfd      → com.clickgroup.pos.cfd       → /cfd           (Customer Facing Display —
    //              one-time restaurant login stores the slug, then opens /cfd/<slug>)
    //   delivery → com.clickgroup.pos.delivery → /restaurant-login (first run) then
    //              the staff PIN screen, landing on /dashboard/delivery-orders. Binds
    //              the restaurant slug to the device exactly like cashier — see
    //              MainActivity.java.
    //   kds      → com.clickgroup.pos.kds     → /restaurant-login (first run) then
    //              the staff PIN screen, landing on /dashboard/kds. Same slug-binding
    //              + single-screen kiosk lock as delivery — see MainActivity.java.
    //
    // Each applicationId must have a matching client entry in
    // google-services.json or the com.google.gms.google-services task fails the
    // build. seller/cfd don't use push, so their entries are structural stubs.
    flavorDimensions "role"
    productFlavors {
        cashier {
            dimension "role"
            resValue "string", "app_name", "ClickGroup Cashier"
            resValue "string", "title_activity_main", "ClickGroup Cashier"
        }
        driver {
            dimension "role"
            applicationIdSuffix ".driver"
            versionNameSuffix "-driver"
            resValue "string", "app_name", "ClickGroup Driver"
            resValue "string", "title_activity_main", "ClickGroup Driver"
        }
        delivery {
            dimension "role"
            applicationIdSuffix ".delivery"
            versionNameSuffix "-delivery"
            resValue "string", "app_name", "ClickGroup Delivery"
            resValue "string", "title_activity_main", "ClickGroup Delivery"
        }
        seller {
            dimension "role"
            applicationIdSuffix ".seller"
            versionNameSuffix "-seller"
            resValue "string", "app_name", "ClickGroup Seller"
            resValue "string", "title_activity_main", "ClickGroup Seller"
        }
        cfd {
            dimension "role"
            applicationIdSuffix ".cfd"
            versionNameSuffix "-cfd"
            resValue "string", "app_name", "ClickGroup CFD"
            resValue "string", "title_activity_main", "ClickGroup CFD"
        }
        kds {
            dimension "role"
            applicationIdSuffix ".kds"
            versionNameSuffix "-kds"
            resValue "string", "app_name", "ClickGroup KDS"
            resValue "string", "title_activity_main", "ClickGroup KDS"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Messaging (required for push notifications via @capacitor/push-notifications)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
