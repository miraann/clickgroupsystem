<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
<title>ClickGroup POS</title>
<style>
  :root { --bg: #022658; --fg: #fff; --muted: rgba(255,255,255,.55); --accent: #f5c518; --err: #fb7185; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 32px; text-align: center; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; background: #fff; }
  h1 { margin: 0; font-size: 20px; }
  #text { color: var(--muted); min-height: 3em; max-width: 440px; }
  .error #text { color: var(--err); }
  .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
  .error .spin { display: none; }
  .buttons { display: none; gap: 10px; -webkit-app-region: no-drag; }
  .error .buttons { display: flex; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 18px; cursor: pointer; background: rgba(255,255,255,.1); color: var(--fg); }
  button.primary { background: var(--accent); color: #111; font-weight: 600; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="main">
  <img src="build/icon.png" alt="">
  <h1>ClickGroup POS</h1>
  <div class="spin"></div>
  <div id="text">Starting…</div>
  <div class="buttons">
    <button class="primary" onclick="desktop.retry()">Retry</button>
    <button onclick="desktop.logs()">Open logs</button>
    <button onclick="desktop.quit()">Quit</button>
  </div>
</main>
<script>
  // Called by main.js: state is 'busy' or 'error'.
  window.setState = (state, text) => {
    document.getElementById('main').className = state === 'error' ? 'error' : ''
    document.getElementById('text').textContent = text
  }
</script>
</body>
</html>
